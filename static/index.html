<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учебники по Wi-Fi</title>
<style>
:root {
  --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a65; --card: #ffffff; --line: #e3e1db;
  --accent: #2f6f4f; --accent-fg: #ffffff; --accent-soft: #e3efe8;
  --warn: #9a5b00; --warn-soft: #fbf0dc; --err: #b3261e; --err-soft: #fbe5e3;
  --off: #a9a7a0; --bar: #ecebe6; --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18191a; --fg: #ecebe7; --muted: #a3a29c; --card: #222325; --line: #36373a;
    --accent: #6cc296; --accent-fg: #0f2419; --accent-soft: #1f3a2c;
    --warn: #f0b860; --warn-soft: #3a2e1a; --err: #f2867d; --err-soft: #3d2120;
    --off: #6a6a66; --bar: #303134; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
header h1 { font-size: 19px; margin: 0; }
header .sp { flex: 1; }
header a, .hlink { color: var(--accent); text-decoration: none; font-weight: 600; background: none; border: none; cursor: pointer; padding: 0; font-size: 15px; }
.wrap { max-width: 1600px; margin: 0 auto; padding: 20px; }
@media (max-width: 900px) { .wrap { padding: 16px; } }
.summary { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
@media (max-width: 900px) { .summary { grid-template-columns: 1fr 1fr; } .summary .addr { grid-column: 1 / -1; } }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); min-width: 0; }
.tile .k { font-size: 13px; color: var(--muted); }
.tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile.addr .v { font-size: 20px; word-break: break-all; color: var(--accent); }
.tile.addr .k2 { font-size: 13px; color: var(--muted); margin-top: 2px; }
main { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; gap: 20px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font-size: 17px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
.panel h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px 12px; text-align: center; cursor: pointer; color: var(--muted); transition: .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.drop b { color: var(--fg); display: block; font-size: 16px; margin-bottom: 4px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.row label { color: var(--muted); font-size: 13px; }
input[type=text] { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; min-width: 0; flex: 1; }
input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; flex: none; }
.link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }
.link.danger { color: var(--err); }
.progress { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
#uploadBox { margin: 10px 0; font-size: 13px; color: var(--muted); }
.books { max-height: calc(100vh - 430px); min-height: 120px; overflow-y: auto; margin-top: 6px; border-top: 1px solid var(--line); }
.folder { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 10px 2px 4px; display: flex; gap: 8px; align-items: center; }
.book { display: flex; gap: 9px; align-items: center; padding: 6px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.book:hover { background: var(--bg); }
.book .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ext { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--bar); color: var(--muted); }
.size { font-size: 12px; color: var(--muted); white-space: nowrap; }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }
.alert { padding: 10px 12px; border-radius: 8px; margin: 0 0 10px; font-size: 14px; background: var(--warn-soft); color: var(--warn); }
.alert.err { background: var(--err-soft); color: var(--err); }
.alert a { color: inherit; font-weight: 600; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; background: var(--card); }
.card.off { opacity: .6; }
.card .top { display: flex; gap: 8px; align-items: center; }
.card .top b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--off); }
.dot.ok { background: var(--accent); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
.status { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status.err { color: var(--err); white-space: normal; } .status.warn { color: var(--warn); white-space: normal; } .status.ok { color: var(--accent); }
.stats { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.stats .low { color: var(--err); font-weight: 600; }
.actions { display: flex; gap: 12px; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); width: min(720px, calc(100vw - 32px)); max-height: 80vh; padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .head { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 10px; }
dialog .head h3 { margin: 0; flex: 1; font-size: 17px; }
dialog .body { padding: 12px 16px; overflow-y: auto; max-height: calc(80vh - 60px); }
dialog pre { white-space: pre-wrap; font-size: 13px; margin: 0; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
#toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 20; display: none; max-width: calc(100vw - 32px); }
#toast.err { background: var(--err); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Учебники по Wi-Fi</h1>
  <span class="sp"></span>
  <button class="hlink" id="journalBtn">Журнал</button>
  <a href="/help" target="_blank">Инструкция</a>
</header>

<div class="wrap">
  <div class="summary">
    <div class="tile addr"><div class="k">Адрес для планшетов (открыть в браузере на планшете, чтобы установить приложение)</div><div class="v" id="addr">…</div><div class="k2" id="addr2"></div></div>
    <div class="tile"><div class="k">Учебников</div><div class="v" id="tBooks">–</div></div>
    <div class="tile"><div class="k">Планшетов на связи</div><div class="v" id="tOnline">–</div></div>
    <div class="tile"><div class="k">Всё скачано</div><div class="v" id="tSynced">–</div></div>
  </div>

  <main>
    <section class="panel">
      <h2>Учебники <small id="libCount"></small></h2>
      <div class="drop" id="drop">
        <b>Перетащите учебники или папки сюда</b>
        или нажмите, чтобы выбрать файлы<br>
        <span style="font-size:12px">Они автоматически скачаются на все планшеты</span>
      </div>
      <input type="file" id="fileInput" multiple hidden>
      <div class="row">
        <label for="folder">В папку:</label>
        <input type="text" id="folder" list="folders" placeholder="необязательно, например: 5 класс/Математика">
        <datalist id="folders"></datalist>
      </div>
      <div id="uploadBox" hidden><div id="uploadText"></div><div class="progress"><div id="uploadBar"></div></div></div>
      <div class="row" style="margin-bottom:0">
        <label style="display:flex;gap:6px;align-items:center;color:var(--fg);font-size:14px"><input type="checkbox" id="allBooks"> Выбрать все</label>
        <span style="flex:1"></span>
        <button class="link danger" id="delBooks">Удалить выбранные</button>
      </div>
      <div class="books" id="books"></div>
    </section>

    <section class="panel">
      <h2>Планшеты <small id="devCount"></small></h2>
      <div id="alerts"></div>
      <div class="filters" id="filters"></div>
      <div class="grid" id="devices"></div>
    </section>
  </main>
</div>

<dialog id="dlg"><div class="head"><h3 id="dlgTitle"></h3><button class="btn" onclick="dlg.close()">Закрыть</button></div><div class="body" id="dlgBody"></div></dialog>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => n == null ? '—' : n < 1024**2 ? Math.max(1, Math.round(n/1024)) + ' КБ'
  : n < 1024**3 ? (n/1024**2).toFixed(1).replace('.', ',') + ' МБ' : (n/1024**3).toFixed(1).replace('.', ',') + ' ГБ';
const BOOK_EXT = new Set(['pdf','epub','fb2','djvu','djv','mobi','azw','azw3','txt','rtf','doc','docx','odt','chm','cbz','cbr','html','htm','zip','ppt','pptx']);

let state = null, libKey = '', filter = 'all';
const selBooks = new Set();
try { filter = localStorage.getItem('filter') || 'all'; } catch (e) {}

function toast(msg, isErr) {
  const t = $('toast'); t.textContent = msg; t.className = isErr ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', isErr ? 6000 : 3500);
}
async function api(path, body) {
  const r = await fetch('/api/admin/' + path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({error: 'Программа не отвечает'}));
  if (!r.ok || data.error) throw new Error(data.error || 'Ошибка');
  return data;
}
async function act(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }
function ago(t) {
  if (!t) return 'никогда';
  const s = Date.now() / 1000 - t;
  if (s < 60) return 'только что';
  if (s < 3600) return Math.floor(s / 60) + ' мин назад';
  if (s < 86400) return Math.floor(s / 3600) + ' ч назад';
  return new Date(t * 1000).toLocaleDateString('ru');
}

/* ---------- учебники ---------- */
function renderLibrary() {
  const library = state.books;
  const paths = new Set(library.map(b => b.path));
  for (const p of [...selBooks]) if (!paths.has(p)) selBooks.delete(p);
  const groups = new Map();
  for (const b of library) {
    const i = b.path.lastIndexOf('/'), dir = i < 0 ? '' : b.path.slice(0, i);
    if (!groups.has(dir)) groups.set(dir, []);
    groups.get(dir).push(b);
  }
  $('folders').innerHTML = [...groups.keys()].filter(Boolean).map(d => `<option value="${esc(d)}">`).join('');
  $('libCount').textContent = library.length ? `${library.length} шт., ${fmtSize(library.reduce((s, b) => s + b.size, 0))}` : '';
  $('allBooks').checked = library.length > 0 && selBooks.size === library.length;
  if (!library.length) { $('books').innerHTML = '<div class="empty">Пока пусто. Добавьте учебники — планшеты скачают их сами.</div>'; return; }
  let h = '';
  for (const [dir, items] of [...groups].sort((a, b) => a[0].localeCompare(b[0], 'ru'))) {
    if (dir) h += `<div class="folder"><input type="checkbox" data-dir="${esc(dir)}" ${items.every(b => selBooks.has(b.path)) ? 'checked' : ''}> ${esc(dir)}</div>`;
    for (const b of items) {
      const name = b.path.slice(dir ? dir.length + 1 : 0), ext = name.includes('.') ? name.split('.').pop() : '';
      h += `<div class="book" data-path="${esc(b.path)}"><input type="checkbox" ${selBooks.has(b.path) ? 'checked' : ''}>
        <span class="name" title="${esc(b.path)}">${esc(name)}</span><span class="ext">${esc(ext)}</span><span class="size">${fmtSize(b.size)}</span></div>`;
    }
  }
  $('books').innerHTML = h;
}
$('books').addEventListener('click', e => {
  const dirBox = e.target.closest('[data-dir]');
  if (dirBox) {
    const dir = dirBox.dataset.dir + '/';
    for (const b of state.books) if (b.path.startsWith(dir) && !b.path.slice(dir.length).includes('/')) dirBox.checked ? selBooks.add(b.path) : selBooks.delete(b.path);
  } else {
    const row = e.target.closest('.book'); if (!row) return;
    const p = row.dataset.path; selBooks.has(p) ? selBooks.delete(p) : selBooks.add(p);
  }
  renderLibrary();
});
$('allBooks').onchange = e => { selBooks.clear(); if (e.target.checked) state.books.forEach(b => selBooks.add(b.path)); renderLibrary(); };
$('delBooks').onclick = () => act(async () => {
  if (!selBooks.size) return toast('Сначала отметьте учебники');
  if (!confirm(`Удалить ${selBooks.size} учебник(ов)?\nОни удалятся и со всех планшетов при следующей проверке.`)) return;
  await api('delete', {paths: [...selBooks]}); selBooks.clear(); await tick(true);
});

/* ---------- добавление файлов ---------- */
const drop = $('drop');
drop.onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { uploadFiles([...e.target.files].map(f => ({file: f, rel: f.name}))); e.target.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = async e => {
  e.preventDefault(); drop.classList.remove('over');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const files = [];
  if (entries.length) { for (const en of entries) await walkEntry(en, '', files); }
  else for (const f of e.dataTransfer.files) files.push({file: f, rel: f.name});
  uploadFiles(files);
};
async function walkEntry(entry, prefix, out) {
  if (entry.isFile) { out.push({file: await new Promise((res, rej) => entry.file(res, rej)), rel: prefix + entry.name}); return; }
  const reader = entry.createReader();
  while (true) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;
    for (const child of batch) await walkEntry(child, prefix + entry.name + '/', out);
  }
}
function putFile(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest(); x.open('PUT', url);
    x.upload.onprogress = e => onProgress(e.loaded);
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {} x.status === 200 ? resolve(d) : reject(new Error(d.error || 'Ошибка загрузки')); };
    x.onerror = () => reject(new Error('Программа не отвечает'));
    x.send(file);
  });
}
async function uploadFiles(items) {
  const skipped = items.filter(i => !BOOK_EXT.has(i.file.name.split('.').pop().toLowerCase()) || i.file.name.startsWith('.'));
  items = items.filter(i => !skipped.includes(i));
  if (!items.length) return toast(skipped.length ? 'Среди файлов нет учебников поддерживаемых форматов' : 'Нет файлов', true);
  const folder = $('folder').value.trim().replace(/^\/+|\/+$/g, '');
  const total = items.reduce((s, i) => s + i.file.size, 0);
  let doneBytes = 0; const errors = [];
  $('uploadBox').hidden = false;
  for (const [n, it] of items.entries()) {
    const rel = (folder ? folder + '/' : '') + it.rel;
    $('uploadText').textContent = `Добавляю ${n + 1} из ${items.length}: ${it.rel}`;
    try {
      await putFile('/api/admin/upload?path=' + encodeURIComponent(rel), it.file,
        loaded => $('uploadBar').style.width = (100 * (doneBytes + loaded) / Math.max(total, 1)) + '%');
    } catch (e) { errors.push(it.rel + ': ' + e.message); }
    doneBytes += it.file.size;
  }
  $('uploadBox').hidden = true; $('uploadBar').style.width = '0';
  await tick(true);
  const msg = `Добавлено учебников: ${items.length - errors.length}` + (skipped.length ? `. Пропущено других файлов: ${skipped.length}` : '');
  if (errors.length) toast(msg + '. Ошибки: ' + errors.join('; '), true); else toast(msg + '. Планшеты скачают их в течение минуты.');
}

/* ---------- планшеты ---------- */
const devName = d => d.name || d.id;
function devStatus(d) {
  const total = state.books.length;
  if (!d.online) return {cls: '', dot: '', text: 'Не на связи · был ' + ago(d.last_seen), group: 'off'};
  if (d.state === 'no_permission') return {cls: 'err', dot: 'err', text: 'Нет доступа к файлам — откройте приложение на планшете и нажмите «Разрешить»', group: 'problem'};
  if (d.state === 'error') return {cls: 'err', dot: 'err', text: 'Ошибка: ' + (d.error || 'неизвестно'), group: 'problem'};
  if (d.version !== state.version) return {cls: '', dot: 'warn', text: 'Проверяет обновления…', group: 'syncing'};
  if (d.state === 'syncing') {
    const pct = d.total ? 100 * d.done / d.total : 0;
    return {cls: '', dot: 'warn', text: `Скачивает ${Math.min(d.done + 1, d.total)} из ${d.total}` + (d.current ? ': ' + d.current.split('/').pop() : ''), pct, group: 'syncing'};
  }
  if (d.state === 'ok') return {cls: 'ok', dot: 'ok', text: total ? `Все учебники скачаны (${d.have})` : 'Учебников пока нет', group: 'ok'};
  return {cls: '', dot: 'warn', text: 'Подключается…', group: 'syncing'};
}
function renderDevices() {
  const all = state.devices.slice().sort((a, b) => devName(a).localeCompare(devName(b), 'ru', {numeric: true}));
  const st = new Map(all.map(d => [d.id, devStatus(d)]));
  const count = g => all.filter(d => st.get(d.id).group === g).length;
  const online = all.filter(d => d.online).length;
  $('tOnline').textContent = `${online} из ${all.length}`;
  $('tSynced').textContent = `${count('ok')} из ${all.length}`;
  $('devCount').textContent = all.length ? `всего ${all.length}` : '';

  const FILTERS = [['all', 'Все', all.length], ['problem', 'Ошибки', count('problem')], ['syncing', 'Скачивают', count('syncing')], ['ok', 'Готовы', count('ok')], ['off', 'Не на связи', count('off')]];
  $('filters').innerHTML = all.length ? FILTERS.map(([k, t, n]) => `<button class="chip ${filter === k ? 'on' : ''}" data-f="${k}">${t} · ${n}</button>`).join('') : '';

  let alerts = '';
  if (!state.apk) alerts += '<div class="alert err">Нет файла приложения apk/uchebniki.apk — планшетам нечего устанавливать. Скачайте его со страницы релизов проекта.</div>';
  if (!all.length) alerts += `<div class="alert">Пока ни один планшет не подключился. Откройте на планшете в браузере адрес <b>${esc(state.addresses[0] || '')}</b> и установите приложение «Учебники» (<a href="/help#tablet" target="_blank">инструкция</a>).</div>`;
  $('alerts').innerHTML = alerts;

  const shown = all.filter(d => filter === 'all' || st.get(d.id).group === filter);
  $('devices').innerHTML = shown.map(d => {
    const s = st.get(d.id);
    const lowSpace = d.free != null && d.free < 300 * 1024 * 1024;
    return `<div class="card ${d.online ? '' : 'off'}" data-id="${esc(d.id)}">
      <div class="top"><span class="dot ${s.dot}"></span><b title="${esc(devName(d))}">${esc(devName(d))}</b></div>
      <div class="meta" title="${esc(d.model)} · Android ${esc(d.android)} · IP ${esc(d.ip)}">${esc(d.model || 'Модель неизвестна')} · Android ${esc(d.android || '?')}</div>
      ${d.online ? `<div class="stats">${d.battery != null && d.battery >= 0 ? `<span>Заряд ${d.battery}%</span>` : ''}${d.free != null ? `<span class="${lowSpace ? 'low' : ''}">Свободно ${fmtSize(d.free)}</span>` : ''}</div>` : ''}
      <div class="status ${s.cls}" title="${esc(s.text)}">${esc(s.text)}</div>
      ${s.pct != null ? `<div class="progress"><div style="width:${s.pct}%"></div></div>` : ''}
      <div class="actions"><button class="link" data-act="rename">Имя</button>${d.online ? '' : '<button class="link danger" data-act="forget">Забыть</button>'}</div></div>`;
  }).join('') || (all.length ? '<div class="empty">Таких планшетов нет</div>' : '');
}
$('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f; try { localStorage.setItem('filter', filter); } catch (err) {}
  renderDevices();
});
$('devices').addEventListener('click', e => {
  const card = e.target.closest('.card'), btn = e.target.closest('[data-act]');
  if (!card || !btn) return;
  const d = state.devices.find(x => x.id === card.dataset.id); if (!d) return;
  act(async () => {
    if (btn.dataset.act === 'rename') {
      const name = prompt('Название планшета (например, номер на наклейке).\nОно появится и в приложении на планшете:', devName(d));
      if (name && name.trim()) { await api('rename', {id: d.id, name}); await tick(); }
    } else if (confirm(`Убрать «${devName(d)}» из списка?\nЕсли планшет снова выйдет на связь, он появится опять.`)) {
      await api('forget', {id: d.id}); await tick();
    }
  });
});
$('journalBtn').onclick = () => act(async () => {
  const r = await api('journal');
  $('dlgTitle').textContent = 'Журнал';
  $('dlgBody').innerHTML = r.text ? `<pre>${esc(r.text.trim().split('\n').reverse().join('\n'))}</pre>` : '<div class="empty">Пока пусто</div>';
  $('dlg').showModal();
});

/* ---------- опрос ---------- */
let offline = false;
async function tick(forceLib) {
  try {
    state = await api('state');
    if (offline) { offline = false; toast('Связь с программой восстановлена'); }
    $('addr').textContent = state.addresses[0] || 'нет сети';
    $('addr2').textContent = state.addresses.length > 1 ? 'Другие адреса: ' + state.addresses.slice(1).join(', ') : '';
    $('tBooks').textContent = state.books.length;
    if (forceLib || state.version !== libKey) { libKey = state.version; renderLibrary(); }
    renderDevices();
  } catch (e) {
    if (!offline) { offline = true; toast('Программа на компьютере не отвечает — запустите её снова', true); }
  }
}
tick(true); setInterval(tick, 2000);
</script>
</body>

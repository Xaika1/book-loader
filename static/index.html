<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Книги на планшеты</title>
<style>
:root {
  --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a65; --card: #ffffff; --line: #e3e1db;
  --accent: #2f6f4f; --accent-fg: #ffffff; --accent-soft: #e3efe8;
  --warn: #9a5b00; --warn-soft: #fbf0dc; --err: #b3261e; --err-soft: #fbe5e3;
  --off: #a9a7a0; --bar: #ecebe6; --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18191a; --fg: #ecebe7; --muted: #a3a29c; --card: #222325; --line: #36373a;
    --accent: #6cc296; --accent-fg: #0f2419; --accent-soft: #1f3a2c;
    --warn: #f0b860; --warn-soft: #3a2e1a; --err: #f2867d; --err-soft: #3d2120;
    --off: #6a6a66; --bar: #303134; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 110px; }
button, input { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
header h1 { font-size: 19px; margin: 0; }
header .sp { flex: 1; }
header a { color: var(--accent); text-decoration: none; font-weight: 600; }
.pill { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.pill.bad { background: var(--err-soft); color: var(--err); }
main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 20px; padding: 20px; max-width: 1600px; margin: 0 auto; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font-size: 17px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
.panel h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px 12px; text-align: center; cursor: pointer; color: var(--muted); transition: .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.drop b { color: var(--fg); display: block; font-size: 16px; margin-bottom: 4px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.row label { color: var(--muted); font-size: 13px; }
input[type=text], input[type=number] { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type=text] { flex: 1; }
input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; flex: none; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--err); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }
.link.danger { color: var(--err); }
.progress { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.progress.err > div { background: var(--err); }
#uploadBox { margin: 10px 0; font-size: 13px; color: var(--muted); }
.books { max-height: calc(100vh - 380px); min-height: 120px; overflow-y: auto; margin-top: 6px; border-top: 1px solid var(--line); }
.folder { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 10px 2px 4px; display: flex; gap: 8px; align-items: center; }
.book { display: flex; gap: 9px; align-items: center; padding: 6px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.book:hover { background: var(--bg); }
.book .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ext { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--bar); color: var(--muted); }
.size { font-size: 12px; color: var(--muted); white-space: nowrap; }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }
.alert { padding: 10px 12px; border-radius: 8px; margin: 0 0 10px; font-size: 14px; background: var(--warn-soft); color: var(--warn); }
.alert.err { background: var(--err-soft); color: var(--err); }
.alert a { color: inherit; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.off { opacity: .55; }
.card .top { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.card .top b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--off); }
.dot.ok { background: var(--accent); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
.status { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status.err { color: var(--err); white-space: normal; } .status.warn { color: var(--warn); white-space: normal; } .status.ok { color: var(--accent); }
.stats { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.stats .low { color: var(--err); font-weight: 600; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 5; }
.bar .info { flex: 1; min-width: 220px; }
.bar .info .sub { font-size: 13px; color: var(--muted); }
details.settings { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
details.settings summary { cursor: pointer; color: var(--muted); font-size: 14px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); width: min(720px, calc(100vw - 32px)); max-height: 80vh; padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .head { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 10px; }
dialog .head h3 { margin: 0; flex: 1; font-size: 17px; }
dialog .body { padding: 12px 16px; overflow-y: auto; max-height: calc(80vh - 60px); }
dialog pre { white-space: pre-wrap; font-size: 13px; margin: 0; }
.ok-text { color: var(--accent); } .muted { color: var(--muted); }
#toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 20; display: none; max-width: calc(100vw - 32px); }
#toast.err { background: var(--err); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Книги на планшеты</h1>
  <span id="adbPill" class="pill">ADB…</span>
  <span class="sp"></span>
  <button class="link" id="journalBtn" style="font-size:15px;font-weight:600">Журнал</button>
  <a href="/help" target="_blank">Инструкция</a>
</header>

<main>
  <section class="panel">
    <h2>1. Книги <small id="libCount"></small></h2>
    <div class="drop" id="drop">
      <b>Перетащите книги или папки сюда</b>
      или нажмите, чтобы выбрать файлы<br>
      <span style="font-size:12px">PDF, EPUB, FB2, DJVU, MOBI, AZW3, TXT, RTF, DOC(X), CHM, CBZ…</span>
    </div>
    <input type="file" id="fileInput" multiple hidden>
    <div class="row">
      <label for="folder">В папку:</label>
      <input type="text" id="folder" list="folders" placeholder="необязательно, например: 5 класс/Математика">
      <datalist id="folders"></datalist>
    </div>
    <div id="uploadBox" hidden><div id="uploadText"></div><div class="progress"><div id="uploadBar"></div></div></div>
    <div class="row" style="margin-bottom:0">
      <label style="display:flex;gap:6px;align-items:center;color:var(--fg);font-size:14px"><input type="checkbox" id="allBooks"> Выбрать все</label>
      <span class="sp" style="flex:1"></span>
      <button class="link danger" id="delBooks">Удалить выбранные из списка</button>
    </div>
    <div class="books" id="books"></div>
  </section>

  <section class="panel">
    <h2>2. Планшеты <small id="devCount"></small></h2>
    <div id="alerts"></div>
    <div class="row">
      <button class="btn" id="selReady">Выбрать все готовые</button>
      <button class="btn" id="selNone">Снять выбор</button>
      <span style="flex:1"></span>
      <input type="text" id="wifiAddr" placeholder="IP по Wi-Fi, напр. 192.168.1.25" style="flex:0 1 230px">
      <button class="btn" id="wifiBtn">Подключить</button>
    </div>
    <div class="grid" id="devices"></div>
    <details class="settings">
      <summary>Настройки</summary>
      <div class="row">
        <label for="targetDir">Папка для книг на планшете:</label>
        <input type="text" id="targetDir" style="flex:0 1 260px">
      </div>
      <div class="row">
        <label for="parallel">Сколько планшетов загружать одновременно:</label>
        <input type="number" id="parallel" min="1" max="64" style="width:80px">
        <button class="btn" id="saveSettings">Сохранить</button>
      </div>
      <div class="row">
        <button class="btn" id="showOff">Показать/скрыть отключённые</button>
        <button class="btn" id="adbRestart">Перезапустить ADB</button>
      </div>
    </details>
  </section>
</main>

<div class="bar">
  <div class="info"><div id="sumMain">Выберите книги и планшеты</div><div class="sub" id="sumSub"></div></div>
  <button class="btn danger" id="deleteBtn">Удалить с планшетов</button>
  <button class="btn" id="retryBtn" hidden>Повторить для ошибок</button>
  <button class="btn" id="cancelBtn" hidden>Остановить</button>
  <button class="btn primary" id="pushBtn">Загрузить на планшеты</button>
</div>

<dialog id="dlg"><div class="head"><h3 id="dlgTitle"></h3><button class="btn small" onclick="dlg.close()">Закрыть</button></div><div class="body" id="dlgBody"></div></dialog>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => n == null ? '—' : n < 1024**2 ? Math.max(1, Math.round(n/1024)) + ' КБ'
  : n < 1024**3 ? (n/1024**2).toFixed(1).replace('.', ',') + ' МБ' : (n/1024**3).toFixed(1).replace('.', ',') + ' ГБ';
const BOOK_EXT = new Set(['pdf','epub','fb2','djvu','djv','mobi','azw','azw3','txt','rtf','doc','docx','odt','chm','cbz','cbr','html','htm','zip']);

let library = [], state = null;
const selBooks = new Set(), selDevs = new Set();
let showOff = true;
try { showOff = localStorage.getItem('showOff') !== '0'; } catch (e) {}

function toast(msg, isErr) {
  const t = $('toast'); t.textContent = msg; t.className = isErr ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', isErr ? 6000 : 3000);
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({error: 'Сервер не отвечает'}));
  if (!r.ok || data.error) throw new Error(data.error || 'Ошибка');
  return data;
}
async function act(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }

/* ---------- библиотека ---------- */
async function loadLibrary() {
  library = (await api('/api/library')).books;
  const paths = new Set(library.map(b => b.path));
  for (const p of [...selBooks]) if (!paths.has(p)) selBooks.delete(p);
  renderLibrary(); renderBar();
}
function renderLibrary() {
  const groups = new Map();
  for (const b of library) {
    const i = b.path.lastIndexOf('/'), dir = i < 0 ? '' : b.path.slice(0, i);
    if (!groups.has(dir)) groups.set(dir, []);
    groups.get(dir).push(b);
  }
  $('folders').innerHTML = [...groups.keys()].filter(Boolean).map(d => `<option value="${esc(d)}">`).join('');
  $('libCount').textContent = library.length ? `${library.length} шт., ${fmtSize(library.reduce((s, b) => s + b.size, 0))}` : '';
  $('allBooks').checked = library.length > 0 && selBooks.size === library.length;
  if (!library.length) { $('books').innerHTML = '<div class="empty">Пока пусто. Добавьте книги — они сохранятся здесь, и их можно будет загружать на планшеты сколько угодно раз.</div>'; return; }
  let h = '';
  for (const [dir, items] of [...groups].sort((a, b) => a[0].localeCompare(b[0], 'ru'))) {
    if (dir) h += `<div class="folder"><input type="checkbox" data-dir="${esc(dir)}" ${items.every(b => selBooks.has(b.path)) ? 'checked' : ''}> ${esc(dir)}</div>`;
    for (const b of items) {
      const name = b.path.slice(dir ? dir.length + 1 : 0);
      h += `<div class="book" data-path="${esc(b.path)}"><input type="checkbox" ${selBooks.has(b.path) ? 'checked' : ''}>
        <span class="name" title="${esc(b.path)}">${esc(name)}</span><span class="ext">${esc(b.ext)}</span><span class="size">${fmtSize(b.size)}</span></div>`;
    }
  }
  $('books').innerHTML = h;
}
$('books').addEventListener('click', e => {
  const dirBox = e.target.closest('[data-dir]');
  if (dirBox) {
    const dir = dirBox.dataset.dir + '/';
    for (const b of library) if (b.path.startsWith(dir) && !b.path.slice(dir.length).includes('/')) dirBox.checked ? selBooks.add(b.path) : selBooks.delete(b.path);
  } else {
    const row = e.target.closest('.book'); if (!row) return;
    const p = row.dataset.path; selBooks.has(p) ? selBooks.delete(p) : selBooks.add(p);
  }
  renderLibrary(); renderBar();
});
$('allBooks').onchange = e => { selBooks.clear(); if (e.target.checked) library.forEach(b => selBooks.add(b.path)); renderLibrary(); renderBar(); };
$('delBooks').onclick = () => act(async () => {
  if (!selBooks.size) return toast('Сначала отметьте книги');
  if (!confirm(`Удалить ${selBooks.size} книг(и) из списка программы?\nС планшетов они НЕ удалятся.`)) return;
  await api('/api/library/delete', {paths: [...selBooks]}); selBooks.clear(); await loadLibrary();
});

/* ---------- загрузка файлов в программу ---------- */
const drop = $('drop');
drop.onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { uploadFiles([...e.target.files].map(f => ({file: f, rel: f.name}))); e.target.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = async e => {
  e.preventDefault(); drop.classList.remove('over');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const files = [];
  if (entries.length) { for (const en of entries) await walkEntry(en, '', files); }
  else for (const f of e.dataTransfer.files) files.push({file: f, rel: f.name});
  uploadFiles(files);
};
async function walkEntry(entry, prefix, out) {
  if (entry.isFile) { out.push({file: await new Promise((res, rej) => entry.file(res, rej)), rel: prefix + entry.name}); return; }
  const reader = entry.createReader();
  while (true) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;
    for (const child of batch) await walkEntry(child, prefix + entry.name + '/', out);
  }
}
function putFile(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest(); x.open('PUT', url);
    x.upload.onprogress = e => onProgress(e.loaded);
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {} x.status === 200 ? resolve(d) : reject(new Error(d.error || 'Ошибка загрузки')); };
    x.onerror = () => reject(new Error('Сервер не отвечает'));
    x.send(file);
  });
}
async function uploadFiles(items) {
  const skipped = items.filter(i => !BOOK_EXT.has(i.file.name.split('.').pop().toLowerCase()) || i.file.name.startsWith('.'));
  items = items.filter(i => !skipped.includes(i));
  if (!items.length) return toast(skipped.length ? 'Среди файлов нет книг поддерживаемых форматов' : 'Нет файлов', true);
  const folder = $('folder').value.trim().replace(/^\/+|\/+$/g, '');
  const existing = new Set(library.map(b => b.path));
  const total = items.reduce((s, i) => s + i.file.size, 0);
  let doneBytes = 0, errors = [];
  $('uploadBox').hidden = false;
  for (const [n, it] of items.entries()) {
    const rel = (folder ? folder + '/' : '') + it.rel;
    $('uploadText').textContent = `Добавляю ${n + 1} из ${items.length}: ${it.rel}`;
    try {
      await putFile('/api/library/upload?path=' + encodeURIComponent(rel), it.file,
        loaded => $('uploadBar').style.width = (100 * (doneBytes + loaded) / Math.max(total, 1)) + '%');
      selBooks.add(rel);
    } catch (e) { errors.push(it.rel + ': ' + e.message); }
    doneBytes += it.file.size;
  }
  $('uploadBox').hidden = true; $('uploadBar').style.width = '0';
  await loadLibrary();
  const replaced = items.filter(i => existing.has((folder ? folder + '/' : '') + i.rel)).length;
  let msg = `Добавлено книг: ${items.length - errors.length}` + (replaced ? ` (заменено: ${replaced})` : '') + (skipped.length ? `. Пропущено не-книг: ${skipped.length}` : '');
  if (errors.length) toast(msg + '. Ошибки: ' + errors.join('; '), true); else toast(msg + '. Они уже отмечены для загрузки.');
}

/* ---------- планшеты ---------- */
const STATE_TEXT = {
  device: ['ok', 'Готов'],
  unauthorized: ['warn', 'Нажмите «Разрешить» на экране планшета'],
  nopermissions: ['err', 'Нет прав на USB — см. инструкцию, раздел «Частые проблемы»'],
  offline: ['warn', 'Не отвечает — переподключите кабель'],
  disconnected: ['', 'Не подключён'],
};
const devName = d => d.name || d.serial;
function jobStatus(js, action) {
  if (!js) return null;
  const pct = js.total ? 100 * js.done / js.total : 0;
  switch (js.state) {
    case 'waiting': return {cls: '', text: 'В очереди…', pct: 0};
    case 'working': return {cls: '', text: action === 'push' ? (js.current ? `Копирую ${js.done + 1} из ${js.total}: ${js.current.split('/').pop()}` : 'Проверяю, что уже есть…') : `Удаляю… ${js.done} из ${js.total}`, pct};
    case 'done': return {cls: 'ok', text: action === 'push' ? 'Готово ✓' + (js.skipped ? ` (уже были: ${js.skipped})` : '') : 'Удалено ✓', pct: 100};
    case 'error': return {cls: 'err', text: 'Ошибка: ' + js.error, pct, err: true};
    case 'cancelled': return {cls: 'warn', text: 'Остановлено', pct, err: true};
  }
}
function sortedDevices() {
  return state.devices.slice().sort((a, b) => devName(a).localeCompare(devName(b), 'ru', {numeric: true}));
}
function renderDevices() {
  const job = state.job, all = sortedDevices();
  const ready = all.filter(d => d.state === 'device');
  for (const s of [...selDevs]) if (!ready.some(d => d.serial === s)) selDevs.delete(s);
  const shown = all.filter(d => showOff || d.state !== 'disconnected' || (job && job.devices[d.serial]));
  $('devCount').textContent = `готово ${ready.length} из ${all.length}` + (selDevs.size ? `, выбрано ${selDevs.size}` : '');

  const unauth = all.filter(d => d.state === 'unauthorized').length, noperm = all.filter(d => d.state === 'nopermissions').length;
  let alerts = '';
  if (!state.adb.ok) alerts += `<div class="alert err">${esc(state.adb.error)}. <a href="/help#install" target="_blank">Как установить</a></div>`;
  if (unauth) alerts += `<div class="alert">${unauth} планшет(ов) ждут разрешения: на их экране нажмите «Всегда разрешать с этого компьютера» → «ОК».</div>`;
  if (noperm) alerts += `<div class="alert err">${noperm} планшет(ов) с ошибкой «нет прав». Нужно один раз настроить компьютер — <a href="/help#problems" target="_blank">см. инструкцию</a>.</div>`;
  if (state.adb.ok && !all.length) alerts += `<div class="alert">Планшеты не найдены. Подключите их кабелем и проверьте, что на них включена «Отладка по USB» (<a href="/help#tablet" target="_blank">инструкция</a>).</div>`;
  $('alerts').innerHTML = alerts;

  $('devices').innerHTML = shown.map(d => {
    const [cls, text] = STATE_TEXT[d.state] || ['warn', d.state];
    const js = job && jobStatus(job.devices[d.serial], job.action);
    const ok = d.state === 'device', sel = selDevs.has(d.serial);
    const lowSpace = d.free != null && d.free < 300 * 1024 * 1024;
    const stats = ok ? `<div class="stats">${d.battery != null ? `<span>Заряд ${d.battery}%</span>` : ''}${d.free != null ? `<span class="${lowSpace ? 'low' : ''}">Свободно ${fmtSize(d.free)}</span>` : ''}</div>` : '';
    const status = js ? `<div class="status ${js.cls}" title="${esc(js.text)}">${esc(js.text)}</div><div class="progress ${js.err ? 'err' : ''}"><div style="width:${js.pct}%"></div></div>`
                      : `<div class="status ${cls}">${esc(text)}</div>`;
    const acts = [['rename', 'Имя']];
    if (ok) acts.push(['books', 'Книги на нём'], ['wake', 'Найти'], ...(d.wifi ? [] : [['wifi', 'Wi-Fi']]));
    if (d.state === 'disconnected') acts.push(['forget', 'Забыть']);
    return `<div class="card ${sel ? 'sel' : ''} ${ok ? '' : 'off'}" data-serial="${esc(d.serial)}">
      <div class="top" data-act="toggle"><input type="checkbox" ${sel ? 'checked' : ''} ${ok ? '' : 'disabled'}><span class="dot ${cls}"></span><b title="${esc(devName(d))}">${esc(devName(d))}</b></div>
      <div class="meta" title="${esc(d.serial)}">${esc(d.model || 'Модель неизвестна')} · ${d.wifi ? 'Wi-Fi' : 'USB'} · ${esc(d.serial)}</div>
      ${stats}${status}
      <div class="actions">${acts.map(([a, t]) => `<button class="link ${a === 'forget' ? 'danger' : ''}" data-act="${a}">${t}</button>`).join('')}</div></div>`;
  }).join('');
}
$('devices').addEventListener('click', e => {
  const card = e.target.closest('.card'); const btn = e.target.closest('[data-act]');
  if (!card || !btn) return;
  const d = state.devices.find(x => x.serial === card.dataset.serial); if (!d) return;
  const a = btn.dataset.act;
  if (a === 'toggle') {
    if (d.state !== 'device') return;
    selDevs.has(d.serial) ? selDevs.delete(d.serial) : selDevs.add(d.serial);
    renderDevices(); renderBar(); return;
  }
  act(async () => {
    if (a === 'rename') {
      const name = prompt('Название планшета (например, номер на наклейке):', devName(d));
      if (name && name.trim()) { await api('/api/device/rename', {serial: d.serial, name}); await tick(); }
    } else if (a === 'wake') {
      await api('/api/device/wake', {serial: d.serial}); toast(`Экран «${devName(d)}» включён — найдите планшет с горящим экраном`);
    } else if (a === 'forget') {
      if (confirm(`Убрать «${devName(d)}» из списка?`)) { await api('/api/device/forget', {serial: d.serial}); await tick(); }
    } else if (a === 'wifi') {
      if (!confirm(`Включить для «${devName(d)}» подключение по Wi-Fi?\nПланшет и компьютер должны быть в одной сети. После перезагрузки планшета это нужно повторить.`)) return;
      toast('Подключаю по Wi-Fi…');
      const r = await api('/api/wifi/enable', {serial: d.serial}); toast('Подключено по Wi-Fi: ' + r.address);
    } else if (a === 'books') {
      showDeviceBooks(d);
    }
  });
});
async function showDeviceBooks(d) {
  $('dlgTitle').textContent = 'Книги на «' + devName(d) + '»';
  $('dlgBody').innerHTML = '<p class="muted">Загружаю список…</p>'; $('dlg').showModal();
  const r = await api('/api/device/books', {serial: d.serial}).catch(e => ({error: e.message}));
  if (r.error) { $('dlgBody').innerHTML = `<p class="alert err">${esc(r.error)}</p>`; return; }
  let h = `<p class="muted">Папка: ${esc(state.settings.target_dir)}. Книг: ${r.books.length}.</p>`;
  if (r.missing.length) h += `<div class="alert">Нет на планшете (есть в программе): ${r.missing.length}<br>${r.missing.map(esc).join('<br>')}</div>`;
  h += r.books.length ? r.books.map(b => `<div class="book" style="cursor:default"><span class="name">${esc(b.path)}</span><span class="size">${fmtSize(b.size)}</span>${b.in_library ? '' : '<span class="ext" title="Этой книги нет в списке программы">не из программы</span>'}</div>`).join('')
                      : '<div class="empty">В папке нет книг</div>';
  $('dlgBody').innerHTML = h;
}
$('selReady').onclick = () => { state.devices.filter(d => d.state === 'device').forEach(d => selDevs.add(d.serial)); renderDevices(); renderBar(); };
$('selNone').onclick = () => { selDevs.clear(); renderDevices(); renderBar(); };
$('wifiBtn').onclick = () => act(async () => {
  const addr = $('wifiAddr').value.trim(); if (!addr) return toast('Введите IP-адрес планшета', true);
  const r = await api('/api/wifi/connect', {address: addr}); $('wifiAddr').value = ''; toast('Подключено: ' + r.address);
});
$('showOff').onclick = () => { showOff = !showOff; try { localStorage.setItem('showOff', showOff ? '1' : '0'); } catch (e) {} renderDevices(); };
$('adbRestart').onclick = () => act(async () => { toast('Перезапускаю ADB…'); await api('/api/adb/restart', {}); toast('ADB перезапущен'); });
$('saveSettings').onclick = () => act(async () => {
  await api('/api/settings', {target_dir: $('targetDir').value, parallel: +$('parallel').value}); toast('Настройки сохранены'); settingsLoaded = false; await tick();
});

/* ---------- нижняя панель и операции ---------- */
function renderBar() {
  if (!state) return;
  const job = state.job, running = job && job.running;
  const bytes = library.filter(b => selBooks.has(b.path)).reduce((s, b) => s + b.size, 0);
  $('pushBtn').disabled = $('deleteBtn').disabled = running || !selBooks.size || !selDevs.size;
  $('pushBtn').textContent = selBooks.size && selDevs.size ? `Загрузить ${selBooks.size} кн. на ${selDevs.size} планш.` : 'Загрузить на планшеты';
  $('cancelBtn').hidden = !running;
  if (job) {
    const st = Object.values(job.devices), c = s => st.filter(x => x.state === s).length;
    const errs = c('error') + c('cancelled');
    $('retryBtn').hidden = running || !errs;
    const verb = job.action === 'push' ? 'Загрузка' : 'Удаление';
    if (running) {
      $('sumMain').textContent = `${verb} идёт: готово ${c('done')} из ${st.length}` + (c('error') ? `, ошибок ${c('error')}` : '');
      $('sumSub').textContent = `${job.books.length} кн. · одновременно до ${job.parallel} планшетов · можно не ждать у компьютера`;
      return;
    }
    if (!selBooks.size || !selDevs.size) {
      $('sumMain').innerHTML = `${verb} завершена: <span class="ok-text">успешно ${c('done')}</span>` + (errs ? `, <span style="color:var(--err)">с ошибкой ${errs}</span>` : '') + ` из ${st.length}`;
      $('sumSub').textContent = errs ? 'Проверьте планшеты с ошибкой и нажмите «Повторить для ошибок»' : 'Можно отключать планшеты';
      return;
    }
  } else $('retryBtn').hidden = true;
  $('sumMain').textContent = selBooks.size || selDevs.size ? `Выбрано: книг ${selBooks.size} (${fmtSize(bytes)}), планшетов ${selDevs.size}` : 'Выберите книги и планшеты';
  $('sumSub').textContent = !selBooks.size ? 'Отметьте книги слева' : !selDevs.size ? 'Отметьте планшеты справа или нажмите «Выбрать все готовые»' : 'Книги, которые уже есть на планшете, копироваться повторно не будут';
}
$('pushBtn').onclick = () => act(async () => {
  await api('/api/job', {action: 'push', books: [...selBooks], serials: [...selDevs]});
  selBooks.clear(); selDevs.clear(); renderLibrary(); await tick();
});
$('deleteBtn').onclick = () => act(async () => {
  if (!confirm(`Удалить ${selBooks.size} книг(и) с ${selDevs.size} планшет(ов)?\nВ списке программы книги останутся.`)) return;
  await api('/api/job', {action: 'delete', books: [...selBooks], serials: [...selDevs]});
  selBooks.clear(); selDevs.clear(); renderLibrary(); await tick();
});
$('cancelBtn').onclick = () => act(async () => { if (confirm('Остановить операцию? Уже скопированные книги останутся на планшетах.')) await api('/api/job/cancel', {}); });
$('retryBtn').onclick = () => act(async () => { await api('/api/job/retry', {}); await tick(); });
$('journalBtn').onclick = () => act(async () => {
  const r = await api('/api/journal');
  $('dlgTitle').textContent = 'Журнал операций';
  $('dlgBody').innerHTML = r.text ? `<pre>${esc(r.text.trim().split('\n\n').reverse().join('\n\n'))}</pre>` : '<div class="empty">Пока ничего не загружали</div>';
  $('dlg').showModal();
});

/* ---------- опрос сервера ---------- */
let settingsLoaded = false, offline = false;
async function tick() {
  try {
    state = await api('/api/state');
    if (offline) { offline = false; toast('Связь с программой восстановлена'); }
    $('adbPill').textContent = state.adb.ok ? 'ADB работает' : 'ADB не работает';
    $('adbPill').className = 'pill' + (state.adb.ok ? '' : ' bad');
    if (!settingsLoaded) { $('targetDir').value = state.settings.target_dir; $('parallel').value = state.settings.parallel; settingsLoaded = true; }
    renderDevices(); renderBar();
  } catch (e) {
    if (!offline) { offline = true; toast('Программа на компьютере не отвечает — запустите её снова', true); }
  }
}
loadLibrary().catch(e => toast(e.message, true));
tick(); setInterval(tick, 1000);
</script>
